<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jo Kevin Nathaniel — software engineer focused on IT infrastructure and security. Projects, experience, and contact."
    />
    <meta name="theme-color" content="#060d0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9f2e9" media="(prefers-color-scheme: light)" />
    <title>Jo Kevin Nathaniel — Software Engineer &amp; IT Infrastructure</title>
    <link rel="preload" href="/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/silkscreen-700.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Set theme class before first paint to avoid a light flash in dark mode.
      (function () {
        var stored = localStorage.getItem('portfolio-theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
